name: Reminder Absen Masuk
on:
  # schedule:
  #   - cron: "7 7 * * *"
  #     timezone: "Asia/Jakarta"
  #   - cron: "45 7 * * *"
  #     timezone: "Asia/Jakarta"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil reminder absen masuk
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/remind?type=in"
