name: Reminder Absen Pulang
on:
  schedule:
    - cron: "7 15 * * *"
      timezone: "Asia/Jakarta"
    - cron: "10 14 * * *"
      timezone: "Asia/Jakarta"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Panggil reminder absen pulang
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/remind?type=out"
